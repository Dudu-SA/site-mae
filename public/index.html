<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Darling Soares · Corretora de Imóveis</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Montserrat:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{color-scheme:light dark;
--paper:#f4f3f1;--sheet:#fff;--soft:#ebe9e6;--ink:#161616;--ink2:#454545;--mu:#7b7b7b;--line:#e3e1dd;--line2:#cfccc7;
--ac:#e8611c;--act:#c4500f;--onac:#fff;--ok:#3f7a3a;--warn:#b07415;--info:#3b5f86;--bad:#b3341f;--band:#141414;
--serif:"Zilla Slab",Rockwell,Georgia,serif;--wide:"Montserrat",var(--sans);--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#111;--sheet:#1a1a1a;--soft:#252525;--ink:#f0efed;--ink2:#c8c6c2;--mu:#959390;--line:#2a2a2a;--line2:#3d3d3d;
--ac:#ff7a33;--act:#ff8a4a;--onac:#1a0d05;--ok:#8fc98a;--warn:#e7b65a;--info:#8fb3db;--bad:#f08a76;--band:#0b0b0b}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}

/* topo */
.band{background:var(--band);color:#bdbdbd;border-bottom:3px solid var(--ac)}
.top{display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;font-size:13px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.brand img{height:40px;width:auto;display:block}
.brand b{display:block;font:600 19px/1 var(--serif);letter-spacing:.01em;color:#fff}
.brand small{display:block;margin-top:4px;font:400 10px var(--wide);letter-spacing:.28em;color:#a9a9a9;text-transform:uppercase}
.top .who{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9a9a9a}
.top button{background:none;border:1px solid #3a3a3a;border-radius:5px;padding:6px 12px;color:#ddd;cursor:pointer;font-size:13px}
.top button:hover{border-color:var(--ac);color:#fff}
@media (max-width:520px){.top .who{display:none}.top button{margin-left:auto}.brand img{height:34px}.brand b{font-size:17px}}
.head{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;padding:28px 0 18px;border-bottom:2px solid var(--ink)}
.eyebrow{display:block;font:500 11px var(--wide);letter-spacing:.24em;text-transform:uppercase;color:var(--act)}
h1{font:600 clamp(34px,8vw,50px)/1.02 var(--serif);letter-spacing:-.01em;margin:8px 0 0}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.out .top .who,.out .top button,.out .nav{display:none}
.out .band{display:none}
.biglogo{display:block;width:min(300px,72vw);height:auto;margin:6vh auto 8px}
.out .head{justify-content:center;text-align:center;border-bottom:0;padding-top:10px}
.out .box{margin-left:auto;margin-right:auto}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;max-width:150px;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mu);cursor:pointer}
.nav button .ic{width:20px;height:20px}
.nav button.on{color:var(--act);border-top-color:var(--ac)}
@media (min-width:860px){
 body{padding-bottom:40px}
 .nav{position:static;justify-content:flex-start;gap:26px;background:none;border:0;max-width:780px;margin:0 auto;padding:10px 20px 0}
 .nav button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:8px 0;border-top:0;border-bottom:2px solid transparent;margin:0}
 .nav button .ic{width:16px;height:16px}
 .nav button.on{border-bottom-color:var(--ac)}
}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:600}
.btn.p:hover{background:var(--act);border-color:var(--act)}
.btn.d{background:none;border-color:transparent;color:var(--bad);margin-left:auto}
.btn.d:hover{text-decoration:underline}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn .ic{width:16px;height:16px}
.lnk{background:none;border:0;padding:0;font-size:13px;color:var(--mu);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ac)}
input,select,textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line2);border-radius:5px;background:var(--sheet);outline:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}

/* início */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats>div{padding:20px 0 18px 18px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font:600 42px/1 var(--serif);color:var(--ink);font-variant-numeric:lining-nums}
.stats span{font-size:13px;color:var(--mu)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec h2{margin:0;font:600 21px var(--serif)}
.types{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:12px}
.types button{background:none;border:0;padding:4px 0;font-size:14px;color:var(--ink2);cursor:pointer}
.types button:hover{color:var(--ac)}
.types small{color:var(--mu);margin-left:5px;font-variant-numeric:tabular-nums}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;padding:13px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.ln>span{font:600 17px/1.3 var(--serif)}
.ln small{grid-column:1;font-size:13px;color:var(--mu)}
.ln b{grid-row:1/3;grid-column:2;align-self:center;font:600 16px var(--serif);text-align:right}
.ln:hover>span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.empty{padding:28px 0;color:var(--mu)}

/* listas */
.fc{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.fc input{flex:2 1 200px;width:auto}.fc select{flex:1 1 140px;width:auto}
.count{font-size:13px;color:var(--mu);margin:14px 0 0}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:0 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.th{width:52px;height:52px;border-radius:4px;background:var(--soft);color:var(--ink2);display:grid;place-items:center;overflow:hidden;font:600 20px var(--serif)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ic{width:22px;height:22px}
.tx{min-width:0}
.it h3{margin:0;font:600 18px/1.25 var(--serif);overflow-wrap:anywhere}
.it:hover h3{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.meta{font-size:13px;color:var(--mu)}
.rt{text-align:right}
.pr{font:600 17px var(--serif);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sc,var(--mu));white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.clip{display:inline-flex;align-items:center;gap:3px;margin-left:8px;color:var(--mu)}
.clip .ic{width:13px;height:13px}
.dt{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.dt>div{overflow:hidden}
.it.open .dt{grid-template-rows:1fr}
.dd{padding:16px 0 4px;cursor:default}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 22px}
.kv small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.kv div{overflow-wrap:anywhere}
.obs{margin:14px 0 0;color:var(--ink2);white-space:pre-line}
.lbl{margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

/* anexos */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.gal button{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--soft);cursor:zoom-in}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block}
.gal .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.25)}
.gal .pl .ic{width:26px;height:26px;fill:#fff;stroke:none}
.docs{border-top:1px solid var(--line)}
.doc{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;text-decoration:none}
.doc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc small{color:var(--mu);font-size:12px;white-space:nowrap}
.doc:hover span{text-decoration:underline;text-underline-offset:3px}
.doc .ic{color:var(--mu)}
.att{margin-top:6px;border:1px dashed transparent;border-radius:6px;transition:border-color .15s,background .15s}
.att.drag{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}
.hint{margin:4px 0 0;font-size:13px;color:var(--mu)}
.ai{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ai:first-child{margin-top:12px;border-top:1px solid var(--line)}
.ait{width:40px;height:40px;border-radius:3px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--mu)}
.ait img{width:100%;height:100%;object-fit:cover}
.ain{min-width:0}.ain b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ain small{font-size:12px;color:var(--mu)}.ain .err{color:var(--bad)}
.bar{display:block;height:3px;margin-top:5px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .2s}
.x{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:4px;color:var(--mu);cursor:pointer}
.x:hover{background:var(--soft);color:var(--bad)}

/* janelas */
.m,.vw{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:6vh 12px 24px;background:rgba(24,20,14,.45);opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.m.on,.vw.on{opacity:1;visibility:visible}
.m>div{width:100%;max-width:620px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:26px 24px 22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);outline:0}
.m h3{margin:0 0 18px;font:600 28px/1.1 var(--serif)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f label{display:block;margin-bottom:4px;font-size:13px;font-weight:500;color:var(--ink2)}
.f .full{grid-column:1/-1}
.f label.btn{display:inline-flex;margin:0;color:var(--ink);font-size:13px}
.fh{grid-column:1/-1;margin-top:10px;padding-top:16px;border-top:1px solid var(--line);font:600 17px var(--serif)}
@media (max-width:360px){.f{grid-template-columns:1fr}}@media (max-width:480px){.m{padding:0;align-items:flex-end}.m>div{border-radius:10px 10px 0 0;max-height:94vh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.vw{background:rgba(10,9,7,.92);align-items:center;flex-direction:column;gap:14px}
.vw img,.vw video{max-width:100%;max-height:80vh;display:block;border-radius:3px}
.vw .bt{display:flex;gap:10px;align-items:center;color:#eee;font-size:13px;max-width:100%}
.vw .bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw .btn{background:transparent;color:#eee;border-color:rgba(255,255,255,.3)}

/* mapa e diversos */
#lmap{height:480px;margin-top:20px;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;z-index:0}
.leaflet-popup-content-wrapper{border-radius:6px;background:var(--sheet);color:var(--ink);font-family:var(--sans)}.leaflet-popup-tip{background:var(--sheet)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}}
.pn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}.pn .ic{width:15px;height:15px}
.box{max-width:400px;margin:30px 0}.box label{display:block;margin:14px 0 4px;font-size:13px;font-weight:500;color:var(--ink2)}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}@keyframes sp{to{transform:rotate(360deg)}}

/* ficha do cliente e leitura de documentos */
.fs{border-top:1px solid var(--line);padding-top:4px}
.fs summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:12px 0 8px;font:600 17px var(--serif)}
.fs summary::-webkit-details-marker{display:none}
.fs summary::before{content:"+";width:14px;font:400 18px var(--sans);color:var(--mu)}
.fs[open] summary::before{content:"–"}
.fs summary small{margin-left:auto;font:400 12px var(--sans);color:var(--mu)}
.fs>.f{padding:4px 0 14px 24px}
@media (max-width:480px){.fs>.f{padding-left:0}}
.fhint{display:block;min-height:0;font-size:12px;color:var(--bad);margin-top:3px}
input.hl,select.hl{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--sheet))}
.scan{margin:0 0 18px;padding:14px 16px;background:var(--soft);border-radius:6px}
.scan-t b{display:block;font:600 16px var(--serif)}.scan-t span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.scan label.btn{display:inline-flex}
.conf{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.conf-h b{display:block;font:600 16px var(--serif)}.conf-h span{font-size:13px;color:var(--mu)}
.conf-l{margin-top:10px;border-top:1px solid var(--line2)}
.cr{display:grid;grid-template-columns:22px 130px 1fr;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
.cr>input[type=checkbox]{width:18px;height:18px;min-height:0;margin:0;accent-color:var(--ac)}
.cl{color:var(--ink2);font-size:13px}
.cv input{min-height:36px;padding:6px 10px;font-size:14px}
.cv small{display:block;font-size:12px;color:var(--warn);margin-top:3px}
.att-ck{grid-template-columns:22px 1fr;border-bottom:0;margin-top:6px}
@media (max-width:480px){.cr{grid-template-columns:22px 1fr}.cr .cv{grid-column:2}}
.err-box,.warn-box,.ok-box{margin:12px 0 0;padding:9px 12px;border-radius:5px;font-size:13px}
.err-box{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.warn-box{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)}
.ok-box{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div class="band"><div class="wrap"><div class="top"><a class="brand" href="#" onclick="go('i');return false"><img src="img/ds.png" alt="DS"><span><b>Darling Soares</b><small>Corretora de imóveis</small></span></a><span class="who" id="mail"></span><button onclick="logout()">Sair</button></div></div></div>
<nav class="nav" id="nav">
 <button data-t="i"><svg class="ic"><use href="#i-book"/></svg><span>Início</span></button>
 <button data-t="h"><svg class="ic"><use href="#i-key"/></svg><span>Imóveis</span></button>
 <button data-t="c"><svg class="ic"><use href="#i-users"/></svg><span>Clientes</span></button>
 <button data-t="m"><svg class="ic"><use href="#i-pin"/></svg><span>Mapa</span></button>

<script>
const TIPOS=["Casa","Apartamento","Terreno","Comercial","Sítio"],SH=["Disponível","Reservado","Vendido","Alugado"],SC=["Novo contato","Em atendimento","Visita marcada","Negociando","Fechado","Perdido"],OBJ=["Comprar","Alugar"];
const IC={Casa:"home",Apartamento:"building",Terreno:"plot",Comercial:"store",Sítio:"tree"};
const SCOL={"Disponível":"var(--ok)","Reservado":"var(--warn)","Vendido":"var(--mu)","Alugado":"var(--info)","Novo contato":"var(--info)","Em atendimento":"var(--warn)","Visita marcada":"var(--ac)","Negociando":"var(--warn)","Fechado":"var(--ok)","Perdido":"var(--bad)"};
const MAXMB=15; /* limite por arquivo depois de comprimir (fotos são reduzidas automaticamente) */
/* leitura de documentos (Firebase AI Logic). Tenta os modelos na ordem; troque se o Google lançar outro. */
window.AI_MODELS=["gemini-3.5-flash","gemini-3.5-flash-lite","gemini-3.6-flash","gemini-2.5-flash"];
window.AI_BACKEND="google"; /* "google" = Gemini Developer API, cota gratuita no plano Spark */
let D={houses:[],clients:[]},tab="i",F={h:{q:"",t:"",s:""},c:{q:"",s:"",o:""}},U,FAIL=null,LM=null,OPEN=null,FA=null,AT={};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I=(n,c="")=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=v=>v?Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}):"—";
const opts=(a,sel,all)=>(all!=null?`<option value="">${all}</option>`:"")+a.map(x=>`<option ${x==sel?"selected":""}>${x}</option>`).join("");
const st=s=>`<span class="st" style="--sc:${SCOL[s]||"var(--mu)"}">${esc(s)}</span>`;
const isImg=a=>/^image\//.test(a.tipo||""),isVid=a=>/^video\//.test(a.tipo||""),isMed=a=>isImg(a)||isVid(a);
const fsz=b=>!b?"":b<1024*1024?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toFixed(1).replace(".",",")+" MB";
const ext=n=>(String(n).split(".").pop()||"").toUpperCase().slice(0,5);
function parseLL(s){const m=String(s||"").match(/(-?\d+[.,]\d+)\s*[,;\s]\s*(-?\d+[.,]\d+)/);return m?[parseFloat(m[1].replace(",",".")),parseFloat(m[2].replace(",","."))]:null}

/* ligação com o Firebase: o bloco type=module no fim troca estas funções pelas reais */
window.onAuth=u=>{FAIL=null;U=u;if(!u)D={houses:[],clients:[]};render()};
window.onData=(k,a)=>{D[k]=a.sort((x,y)=>y.id.localeCompare(x.id));render()};
window.onFail=e=>{FAIL=e||{};render()};
const KEY=c=>c=="imoveis"?"houses":"clients";
window.put=(c,o)=>{const k=KEY(c),i=D[k].findIndex(x=>x.id==o.id);i<0?D[k].unshift(o):D[k][i]=o;render()};
window.rm=(c,id)=>{D[KEY(c)]=D[KEY(c)].filter(x=>x.id!=id);render()};
const MEM={};
window.upload=(id,blob,onp)=>new Promise(res=>{let p=0;const t=setInterval(()=>{p+=.25;onp(Math.min(p,1));if(p>=1){clearInterval(t);MEM[id]=blob;res({path:"mem:"+id})}},150)});
window.unload=p=>{if(p&&p.startsWith("mem:"))delete MEM[p.slice(4)]};
window.fetchBlob=async a=>MEM[a.path.slice(4)];
window.lerDoc=()=>new Promise(r=>setTimeout(()=>r({tipoDocumento:"RG (exemplo do modo demonstração)",nome:"JOSÉ CARLOS DA SILVA",cpf:"52998224725",rg:"2009123456 SSP/CE",nasc:"14/03/1988",cidade:"Fortaleza",estado:"CE",avisos:"Modo demonstração: estes dados são fictícios, o documento não foi lido de verdade."}),1400));
window.logout=()=>location.reload();
setTimeout(()=>{if(U===undefined&&!FAIL)window.onFail({code:"tempo esgotado",message:"A conexão demorou demais."})},8000);
function demo(){D={houses:[{id:"d3",titulo:"Casa com quintal e varanda",tipo:"Casa",status:"Disponível",endereco:"Rua das Flores, 120",bairro:"Centro",cidade:"Fortaleza",preco:350000,quartos:3,area:140,dono:"Sr. Raimundo",fone:"(85) 98888-0000",ll:[-3.7319,-38.5267],obs:"Escritura em dia. Aceita financiamento.",att:[]},{id:"d2",titulo:"Apartamento vista mar",tipo:"Apartamento",status:"Reservado",bairro:"Meireles",cidade:"Fortaleza",preco:620000,quartos:2,area:78,ll:[-3.7236,-38.4890]},{id:"d1",titulo:"Terreno 300 m²",tipo:"Terreno",status:"Vendido",bairro:"Cidade Nova",preco:90000,area:300,ll:[-3.7700,-38.5500]}],clients:[{id:"c3",nome:"Maria Souza",fone:"(85) 90000-0000",status:"Visita marcada",objetivo:"Comprar",tipo:"Casa",orcamento:400000,bairros:"Centro, Aldeota"},{id:"c2",nome:"João Lima",status:"Novo contato",objetivo:"Alugar",orcamento:1800},{id:"c1",nome:"Ana Paula Ribeiro",status:"Negociando",objetivo:"Comprar",tipo:"Apartamento",orcamento:650000}]};FAIL=null;U={email:"modo demonstração"};render()}

/* telas */
const TABS=["i","h","c","m"];
function head(eb,t,act=""){$("#head").innerHTML=`<div><span class="eyebrow">${eb}</span><h1>${t}</h1></div>${act?`<div class="act">${act}</div>`:""}`}
const bNH=`<button class="btn p" onclick="fh()">${I("plus")}Novo imóvel</button>`;
function render(){try{
 document.body.classList.toggle("out",!U||!!FAIL);const v=$("#v");
 if(FAIL){head("Algo deu errado","Sem conexão");v.innerHTML=failV();return}
 if(U===undefined){head("Um momento","Abrindo…");v.innerHTML=`<p class="empty"><span class="spin"></span>Conectando ao Firebase</p>`;return}
 if(!U){$("#head").innerHTML=`<div><img class="biglogo" src="img/logo.png" alt="Darling Soares — Corretora de Imóveis"><span class="eyebrow" style="margin-top:22px">Área da corretora</span></div>`;$("#mail").textContent="";v.innerHTML=loginV();return}
 $("#mail").textContent=U.email||"";
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 AT={};
 if(tab=="i"){const h=new Date().getHours(),d=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  head(d,(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+".",`<button class="btn" onclick="fc()">${I("plus")}Cliente</button><button class="btn p" onclick="fh()">${I("plus")}Imóvel</button>`);v.innerHTML=homeV()}
 if(tab=="h"){head(D.houses.length+(D.houses.length==1?" cadastrado":" cadastrados"),"Imóveis",bNH);v.innerHTML=housesV()}
 if(tab=="c"){head(D.clients.length+(D.clients.length==1?" pessoa":" pessoas"),"Clientes",`<button class="btn p" onclick="fc()">${I("plus")}Novo cliente</button>`);v.innerHTML=clientsV()}
 if(tab=="m"){head("Onde estão","Mapa",bNH);v.innerHTML=mapV();drawMap()}
 if(OPEN){const e=document.querySelector(`.it[data-id="${OPEN}"]`);OPEN=null;if(e)setTimeout(()=>e.scrollIntoView({block:"center"}),30)}
}catch(e){console.error(e);$("#v").innerHTML=`<p class="empty">Erro na tela: ${esc(e.message)}</p>`}}
function go(t,open){tab=t;OPEN=open||null;render();if(!open)scrollTo({top:0})}
function loginV(){return `<div class="box"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><div class="row"><button class="btn p" onclick="login()">Entrar</button></div></div>`}
function failV(){const e=FAIL,c=e.code||"",hint=location.protocol=="file:"?"Você abriu o arquivo direto do computador. Publique no Firebase Hosting ou use um servidor local (npx serve).":c=="permission-denied"?"O Firestore recusou o acesso. Publique as regras do arquivo firestore.rules e confirme que você está logada.":"Confira se o conexao.js está na mesma pasta do index.html e se o firebaseConfig está preenchido.";
 return `<div class="box" style="max-width:520px"><p>${hint}</p><p class="meta">Detalhe técnico: ${esc(c)} ${esc(e.message||"")}</p><div class="row"><button class="btn p" onclick="location.reload()">Tentar de novo</button><button class="btn" onclick="demo()">Ver demonstração</button></div></div>`}

function homeV(){const H=D.houses,C=D.clients,vis=C.filter(c=>c.status=="Visita marcada"),disp=H.filter(h=>h.status=="Disponível").length;
 const ln=(o,t,a,b,c)=>`<button class="ln" onclick="go('${t}','${o.id}')"><span>${esc(a)}</span><small>${b}</small><b>${c}</b></button>`;
 return `<div class="stats"><div><b>${disp}</b><span>disponíveis</span></div><div><b>${C.filter(c=>!["Fechado","Perdido"].includes(c.status)).length}</b><span>clientes ativos</span></div><div><b>${vis.length}</b><span>visitas marcadas</span></div></div>
 <div class="types">${TIPOS.map(t=>`<button onclick="F.h.t='${t}';go('h')">${t}<small>${H.filter(h=>h.tipo==t).length}</small></button>`).join("")}</div>
 <div class="sec"><h2>Visitas marcadas</h2><button class="lnk" onclick="F.c.s='Visita marcada';go('c')">ver todas</button></div>
 ${vis.length?vis.slice(0,5).map(c=>ln(c,"c",c.nome,esc([c.fone,c.objetivo,c.tipo].filter(Boolean).join(" · ")),money(c.orcamento))).join(""):`<p class="empty">Nenhuma visita marcada.</p>`}
 <div class="sec"><h2>Últimos imóveis</h2><button class="lnk" onclick="go('h')">ver todos</button></div>
 ${H.length?H.slice(0,6).map(h=>ln(h,"h",h.titulo||"Sem título",esc([h.tipo,h.bairro].filter(Boolean).join(" · "))+" · "+st(h.status),money(h.preco))).join(""):`<p class="empty">Nada cadastrado ainda. Comece pelo botão “Imóvel”.</p>`}`}

/* arquivos: fotos são reduzidas antes de enviar; miniaturas ficam junto do cadastro */
async function shrink(f,max,q){const bmp=await createImageBitmap(f),k=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",q))}
const b2url=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
const URLS={};
async function fileURL(a){if(a.url)return a.url;if(URLS[a.id])return URLS[a.id];const b=await window.fetchBlob(a);if(!b)throw new Error("arquivo não encontrado");return URLS[a.id]=URL.createObjectURL(b.type?b:new Blob([b],{type:a.tipo}))}
async function openDoc(id){const a=AT[id];if(!a)return;const viewable=/pdf|^image\/|^video\/|^text\//.test(a.tipo);
 const w=viewable?window.open("","_blank"):null;if(w)w.document.write("<p style='font:16px sans-serif;padding:20px'>Abrindo "+esc(a.nome)+"…</p>");
 try{const u=await fileURL(a);if(w){w.location.href=u}else{const l=document.createElement("a");l.href=u;l.download=a.nome;document.body.appendChild(l);l.click();l.remove()}}
 catch(e){if(w)w.close();alert("Não consegui abrir o arquivo: "+(e.code||e.message))}}
function attIcon(a){(a.att||[]).forEach(x=>AT[x.id]=x);const n=(a.att||[]).length;return n?`<span class="clip" title="${n} anexo(s)">${I("clip")}${n}</span>`:""}
function attView(att){att=att||[];if(!att.length)return"";const m=att.filter(isMed),d=att.filter(a=>!isMed(a));
 return (m.length?`<div class="lbl">Fotos e vídeos</div><div class="gal">${m.map(a=>`<button type="button" onclick="openV('${a.id}')" aria-label="${esc(a.nome)}">${a.thumb||a.url&&isImg(a)?`<img src="${esc(a.thumb||a.url)}" alt="" loading="lazy">`:`<span class="pl" style="background:var(--soft);color:var(--mu)">${I("video")}</span>`}${isVid(a)?`<span class="pl">${I("play")}</span>`:""}</button>`).join("")}</div>`:"")
 +(d.length?`<div class="lbl">Documentos</div><div class="docs">${d.map(a=>`<button type="button" class="doc" onclick="openDoc('${a.id}')">${I("file")}<span>${esc(a.nome)}</span><small>${ext(a.nome)} · ${fsz(a.tam)}</small></button>`).join("")}</div>`:"")}
const kv=pairs=>{const p=pairs.filter(x=>x[1]);return p.length?`<div class="kv">${p.map(([k,v])=>`<div><small>${k}</small>${v}</div>`).join("")}</div>`:""};
function item(o,thumb,title,meta,right,body){return `<div class="it${OPEN==o.id?" open":""}" data-id="${o.id}" role="button" tabindex="0" aria-expanded="${OPEN==o.id}" onclick="tg(this)" onkeydown="kd(event,this)">${thumb}<div class="tx"><h3>${title}</h3><div class="meta">${meta}${attIcon(o)}</div></div><div class="rt">${right}</div><div class="dt"><div><div class="dd" onclick="event.stopPropagation()">${body}</div></div></div></div>`}

function housesV(){const f=F.h,q=f.q.toLowerCase();
 const L=D.houses.filter(h=>(!f.t||h.tipo==f.t)&&(!f.s||h.status==f.s)&&(!q||[h.titulo,h.endereco,h.bairro,h.cidade,h.dono,h.obs].join(" ").toLowerCase().includes(q)));
 return `<div class="fc"><input id="q" type="search" placeholder="Buscar por título, bairro, proprietário…" value="${esc(f.q)}" oninput="F.h.q=this.value;keep()"><select onchange="F.h.t=this.value;render()">${opts(TIPOS,f.t,"Todos os tipos")}</select><select onchange="F.h.s=this.value;render()">${opts(SH,f.s,"Qualquer situação")}</select></div>
 ${(f.q||f.t||f.s)?`<p class="count">${L.length} resultado(s) · <button class="lnk" onclick="F.h={q:'',t:'',s:''};render()">limpar filtros</button></p>`:""}
 ${L.length?L.map(h=>{const im=(h.att||[]).find(a=>isImg(a)&&(a.thumb||a.url));
  return item(h,`<div class="th">${im?`<img src="${esc(im.thumb||im.url)}" alt="" loading="lazy">`:I(IC[h.tipo]||"home")}</div>`,esc(h.titulo||"Sem título"),esc([h.tipo,h.bairro].filter(Boolean).join(" · ")),`<div class="pr">${money(h.preco)}</div>${st(h.status)}`,
  kv([["Endereço",esc([h.endereco,h.bairro,h.cidade].filter(Boolean).join(", "))],["Área",h.area?esc(h.area)+" m²":""],["Quartos",esc(h.quartos)],["Proprietário",esc(h.dono)],["Telefone",esc(h.fone)]])
  +(h.obs?`<p class="obs">${esc(h.obs)}</p>`:"")+attView(h.att)
  +`<div class="row">${h.ll?`<a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${h.ll[0]},${h.ll[1]}">${I("pin")}Abrir no Maps</a>`:""}${h.fone?`<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/55${String(h.fone).replace(/\D/g,"")}">${I("chat")}Proprietário</a>`:""}<button class="btn sm p" onclick="fh('${h.id}')">${I("edit")}Editar</button></div>`)}).join(""):`<p class="empty">Nenhum imóvel encontrado.</p>`}`}

function mapV(){window._P=D.houses.filter(h=>h.ll);return window._P.length?`<div id="lmap"></div>`:`<p class="empty">Nenhum imóvel com localização. Edite um imóvel e informe as coordenadas.</p>`}
function drawMap(){if(LM){LM.remove();LM=null}const el=$("#lmap");if(!el)return;if(!window.L){el.innerHTML='<p class="empty" style="padding:30px">Mapa indisponível (sem internet?).</p>';return}
 LM=L.map(el);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(LM);
 const g=L.featureGroup(_P.map(h=>L.marker(h.ll,{icon:L.divIcon({className:"",html:`<div class="pn">${I(IC[h.tipo]||"home")}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(LM).bindPopup(`<b>${esc(h.titulo)}</b><br>${esc(h.endereco||h.bairro||"")}<br>${money(h.preco)}`)));LM.fitBounds(g.getBounds().pad(.2),{maxZoom:16})}
function keep(){const v=$("#q"),p=v.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}
const tg=e=>{e.setAttribute("aria-expanded",e.classList.toggle("open"))},kd=(e,t)=>{if(e.target===t&&(e.key=="Enter"||e.key==" ")){e.preventDefault();tg(t)}};

/* janelas */
let LF;function openM(h){LF=document.activeElement;$("#mb").innerHTML=h;$("#m").classList.add("on");setTimeout(()=>$("#mb").focus(),40)}
function closeM(){SCAN=null;if(FA)cancelFA();$("#m").classList.remove("on");if(LF&&LF.focus)LF.focus()}
$("#m").onmousedown=e=>{if(e.target.id=="m")closeM()};
async function openV(id){const a=AT[id];if(!a)return;const vw=$("#vw");vw.innerHTML=`<p style="color:#ddd"><span class="spin"></span>Carregando…</p>`;vw.classList.add("on");
 let u;try{u=await fileURL(a)}catch(e){vw.innerHTML=`<p style="color:#f99">Não consegui abrir: ${esc(e.code||e.message)}</p><div class="bt"><button class="btn sm" onclick="closeV()">Fechar</button></div>`;return}
 if(!vw.classList.contains("on"))return;
 vw.innerHTML=(isImg(a)?`<img src="${esc(u)}" alt="${esc(a.nome)}">`:`<video src="${esc(u)}" controls autoplay playsinline></video>`)+`<div class="bt"><span>${esc(a.nome)}</span><a class="btn sm" href="${esc(u)}" download="${esc(a.nome)}">Baixar</a><button class="btn sm" onclick="closeV()">${I("x")}Fechar</button></div>`}
function closeV(){$("#vw").classList.remove("on");setTimeout(()=>{if(!$("#vw").classList.contains("on"))$("#vw").innerHTML=""},200)}
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#vw").classList.contains("on")?closeV():closeM()}});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));

/* anexos no formulário */
function attEditor(hint){return `<div class="fh">Documentos e mídia</div><div class="full att" id="att" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="event.preventDefault();this.classList.remove('drag');addF(event.dataTransfer.files)">
 <p class="hint">${hint} Fotos são reduzidas automaticamente; documentos e vídeos até ${MAXMB} MB. No computador, dá para arrastar os arquivos para cá.</p>
 <div class="row" style="margin-top:10px"><label class="btn sm">${I("image")}Foto ou vídeo<input type="file" hidden multiple accept="image/*,video/*" onchange="addF(this.files);this.value=''"></label><label class="btn sm">${I("file")}Documento<input type="file" hidden multiple accept=".pdf,.doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.csv,image/*" onchange="addF(this.files);this.value=''"></label></div>
 <div id="al"></div></div>`}
function startFA(col,rec){FA={col,id:rec.id||uid(),list:(rec.att||[]).map(a=>({...a,st:"ok"})),added:[],removed:[],dead:false}}
function addF(files){const fa=FA;if(!fa)return;for(const f of files){
 const img=/^image\/(jpeg|png|webp|heic|heif|bmp)/i.test(f.type);
 if(!img&&f.size>MAXMB*1048576){alert(`“${f.name}” tem ${fsz(f.size)}. O limite é ${MAXMB} MB${/^video/.test(f.type)?" — grave um vídeo mais curto ou envie pelo WhatsApp":""}.`);continue}
 const a={id:uid(),nome:f.name,tipo:f.type||"",tam:f.size,st:"up",pct:0,prev:img?URL.createObjectURL(f):""};
 fa.list.push(a);fa.added.push(a.id);
 (async()=>{let blob=f;
  if(img){try{blob=await shrink(f,2000,.82);a.tipo="image/jpeg";if(!/\.jpe?g$/i.test(a.nome))a.nome=a.nome.replace(/\.[^.]+$/,"")+".jpg";a.thumb=await b2url(await shrink(f,240,.6))}catch(e){console.warn(e);blob=f}}
  a.tam=blob.size;if(blob.size>MAXMB*1048576)throw {message:`continua grande demais (${fsz(blob.size)})`};
  const r=await window.upload(a.id,blob,p=>{a.pct=p;if(FA===fa)drawAtt()});
  if(fa.dead){window.unload(r.path);return}a.path=r.path;a.st="ok";if(FA===fa)drawAtt()})()
  .catch(e=>{console.error(e);a.st="err";a.err=e.code=="permission-denied"?"sem permissão (regras do Firestore)":e.code=="resource-exhausted"?"cota gratuita do dia esgotada, tente amanhã":(e.code||e.message||"erro");if(FA===fa)drawAtt()})}
 drawAtt()}
function drawAtt(){const el=$("#al");if(!el||!FA)return;
 el.innerHTML=FA.list.map(a=>`<div class="ai"><span class="ait">${isImg(a)&&(a.prev||a.thumb||a.url)?`<img src="${esc(a.prev||a.thumb||a.url)}" alt="">`:I(isVid(a)?"video":"file")}</span><div class="ain"><b>${esc(a.nome)}</b>${a.st=="up"?`<small>Enviando… ${Math.round(a.pct*100)}%</small><i class="bar"><i style="width:${Math.round(a.pct*100)}%"></i></i>`:a.st=="err"?`<small class="err">Não enviou: ${esc(a.err)}</small>`:`<small>${isMed(a)?(isImg(a)?"Foto":"Vídeo"):"Documento"} · ${fsz(a.tam)}</small>`}</div>${a.st=="up"?"<span></span>":`<button type="button" class="x" onclick="rmA('${a.id}')" aria-label="Remover ${esc(a.nome)}">${I("x")}</button>`}</div>`).join("")}
function rmA(id){const a=FA.list.find(x=>x.id==id);if(!a)return;FA.list=FA.list.filter(x=>x.id!=id);
 if(a.path){FA.added.includes(id)?window.unload(a.path):FA.removed.push(a.path)}drawAtt()}

 ["FGTS e financiamento",[["fgts","Tem FGTS?",SN],["fgtsValor","Valor do FGTS (R$)","money"],["pis","PIS","text"],["usarSaldo","Usar saldo?",SN],["saldoValor","Valor a usar (R$)","money"],["financAtivo","Financiamento ativo?",SN],["jaFinanc","Já teve financiamento?",SN],["subsidio","Já recebeu subsídio?",SN]]],
 ["Dependente",[["dep_nome","Nome","text",1],["dep_cpf","CPF","cpf"],["dep_rg","RG","text"],["dep_nasc","Data de nascimento","date"],["dep_profissao","Profissão","text"],["dep_escolaridade","Escolaridade",ESC],["dep_fone","Telefone","tel"],["dep_email","E-mail","email"]]],
 ["Simulação e processo",[["simulacao","Simulação","text"],["valorCasa","Valor da casa (R$)","money"],["local","Local","text"],["modelo","Modelo","text"],["tamanho","Tamanho","text"],["analise","Análise","text"],["entrevista","Entrevista","text"],["condicionou","Condicionou","text"],["dataProc","Data","date"]]],
 ["Atendimento",[["status","Situação",SC],["objetivo","Objetivo",OBJ],["tipo","Tipo de imóvel",["",...TIPOS]],["orcamento","Orçamento (R$)","money"],["bairros","Bairros de interesse","text",1],["obs","Observações","area",1]]]];
const CFF=CF.flatMap(s=>s[1]),CFL=Object.fromEntries(CFF.map(f=>[f[0],f]));
const dBR=v=>{const m=String(v||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:v||""};
const fmtV=(f,v)=>v==null||v===""?"":f[2]=="date"?dBR(v):f[2]=="money"?money(v):String(v);
const onlyD=s=>String(s||"").replace(/\D/g,"");
const mask={cpf:v=>{const d=onlyD(v).slice(0,11);return d.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2")},
 cep:v=>{const d=onlyD(v).slice(0,8);return d.length>5?d.slice(0,5)+"-"+d.slice(5):d},
 tel:v=>{const d=onlyD(v).replace(/^55(?=\d{10,11}$)/,"").slice(0,11);return d.length<3?d:d.length<7?`(${d.slice(0,2)}) ${d.slice(2)}`:d.length<11?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`}};
function cpfOk(v){const d=onlyD(v);if(d.length!=11||/^(\d)\1+$/.test(d))return false;const c=n=>{let s=0;for(let i=0;i<n;i++)s+=+d[i]*(n+1-i);const r=s*10%11%10;return r};return c(9)==+d[9]&&c(10)==+d[10]}
function fieldH(f,v){const [k,l,t,full]=f,id="c_"+k,cls=full?"full":"";
 if(Array.isArray(t))return `<div class="${cls}"><label for="${id}">${l}</label><select id="${id}">${t[0]===""?`<option value="">—</option>`+opts(t.slice(1),v):`<option value="">—</option>`+opts(t,v)}</select></div>`;
 if(t=="area")return `<div class="${cls}"><label for="${id}">${l}</label><textarea id="${id}" rows="3">${esc(v)}</textarea></div>`;
 const it=t=="money"?`type="number" step="0.01" inputmode="decimal"`:t=="date"?`type="date"`:t=="email"?`type="email"`:t=="tel"?`type="tel" inputmode="tel" oninput="this.value=mask.tel(this.value)"`:t=="cpf"?`inputmode="numeric" oninput="this.value=mask.cpf(this.value);cpfHint(this)" onblur="cpfHint(this,1)"`:t=="cep"?`inputmode="numeric" oninput="this.value=mask.cep(this.value)"`:`type="text"`;
 return `<div class="${cls}"><label for="${id}">${l}</label><input id="${id}" ${it} value="${esc(v)}">${t=="cpf"?`<small class="fhint" id="${id}_h"></small>`:""}</div>`}
function cpfHint(el,final){const h=$("#"+el.id+"_h");if(!h)return;const d=onlyD(el.value);h.textContent=d.length==11&&!cpfOk(d)?"CPF parece inválido — confira os números":final&&d.length&&d.length<11?"CPF incompleto":""}
const filled=(c,sec)=>sec[1].filter(f=>c[f[0]]!=null&&c[f[0]]!=="").length;

function clientsV(){const f=F.c,q=f.q.toLowerCase();
 const L=D.clients.filter(c=>(!f.s||c.status==f.s)&&(!f.o||c.objetivo==f.o)&&(!q||[c.nome,c.cpf,onlyD(c.cpf),c.fone,c.email,c.bairros,c.dep_nome,c.obs].join(" ").toLowerCase().includes(q)));
 return `<div class="fc"><input id="q" type="search" placeholder="Buscar por nome, CPF, telefone, bairro…" value="${esc(f.q)}" oninput="F.c.q=this.value;keep()"><select onchange="F.c.s=this.value;render()">${opts(SC,f.s,"Qualquer situação")}</select><select onchange="F.c.o=this.value;render()">${opts(OBJ,f.o,"Comprar ou alugar")}</select></div>
 ${(f.q||f.s||f.o)?`<p class="count">${L.length} resultado(s) · <button class="lnk" onclick="F.c={q:'',s:'',o:''};render()">limpar filtros</button></p>`:""}
 ${L.length?L.map(c=>{const ini=(c.nome||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const body=CF.map(([t,fs])=>{const p=fs.filter(x=>x[0]!="nome"&&x[0]!="obs"&&x[0]!="status"&&c[x[0]]!=null&&c[x[0]]!=="");return p.length?`<div class="lbl">${t}</div>${kv(p.map(x=>[x[1].replace(/\?$/,"").replace(" (R$)",""),esc(fmtV(x,c[x[0]]))]))}`:""}).join("");
  return item(c,`<div class="th">${esc(ini)}</div>`,esc(c.nome),esc([c.objetivo,c.tipo,c.cpf].filter(Boolean).join(" · ")),`<div class="pr">${money(c.orcamento||c.valorCasa)}</div>${st(c.status)}`,
  (body||`<p class="meta">Sem outros dados.</p>`)+(c.obs?`<div class="lbl">Observações</div><p class="obs" style="margin:0">${esc(c.obs)}</p>`:"")+attView(c.att)
  +`<div class="row">${c.fone?`<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/55${onlyD(c.fone)}">${I("chat")}WhatsApp</a>`:""}<button class="btn sm p" onclick="fc('${c.id}')">${I("edit")}Editar</button></div>`)}).join(""):`<p class="empty">Nenhum cliente encontrado.</p>`}`}

function fc(id){const c=D.clients.find(x=>x.id==id)||{status:"Novo contato",objetivo:"Comprar"};startFA("clientes",c);
 const openS=new Set(["Dados pessoais","Atendimento"]);
 openM(`<h3>${id?"Editar cliente":"Novo cliente"}</h3>
 <div class="scan" id="scan"><div class="scan-t"><b>Preencher a partir de um documento</b><span>Tire uma foto (ou escolha uma imagem/PDF) do RG, CNH, comprovante de residência, holerite, carteira de trabalho… O sistema lê e mostra o que encontrou antes de preencher.</span></div>
 <div class="row" style="margin-top:10px"><label class="btn sm p">${I("scan")}Documento do cliente<input type="file" hidden multiple accept="image/*,application/pdf" onchange="scanDoc(this.files,'');this.value=''"></label><label class="btn sm">${I("scan")}Do dependente<input type="file" hidden multiple accept="image/*,application/pdf" onchange="scanDoc(this.files,'dep_');this.value=''"></label></div><div id="scanr"></div></div>
 <div class="f">${CF.map(([t,fs])=>`<details class="full fs" data-s="${t}" ${openS.has(t)||(id&&filled(c,[t,fs]))?"open":""}><summary>${t}<small>${id&&filled(c,[t,fs])?filled(c,[t,fs])+" preenchido(s)":""}</small></summary><div class="f">${fs.map(f=>fieldH(f,c[f[0]])).join("")}</div></details>`).join("")}
 ${attEditor("RG, CPF, CNH, comprovantes de renda e de residência, carteira de trabalho, extrato do FGTS, contratos…")}</div>${actions("sc",id,"clients")}`);drawAtt()}
function sc(){const nome=$("#c_nome").value.trim();if(!nome){$("#c_nome").closest("details").open=true;$("#c_nome").focus();return alert("Informe o nome.")}
 if(SCAN&&SCAN.busy)return alert("Espere a leitura do documento terminar.");
 const att=attOut();if(!att)return;
 const o={id:FA.id,att};for(const [k,,t] of CFF){let v=$("#c_"+k).value;if(typeof v=="string")v=v.trim();o[k]=v}

let SCAN=null;
const DOCF={tipoDocumento:"Que documento(s) é/são, ex.: RG, CNH, comprovante de residência, holerite",nome:"Nome completo da pessoa",cpf:"CPF no formato 000.000.000-00",rg:"Número do RG / registro geral (inclua órgão emissor e UF se aparecer, ex.: 2009123456 SSP/CE). Na CNH é o campo 'Doc. identidade'",
 nasc:"Data de nascimento DD/MM/AAAA",estadoCivil:"Estado civil, se aparecer (ex.: certidão de casamento)",profissao:"Profissão ou cargo",escolaridade:"Escolaridade, se aparecer",fone:"Telefone",email:"E-mail",
 endereco:"Logradouro com número e complemento",bairro:"Bairro",cidade:"Cidade",estado:"UF com 2 letras",cep:"CEP 00000-000",
 admissao:"Data de admissão DD/MM/AAAA",renda:"Renda/salário bruto mensal em reais, só número com ponto decimal (ex.: 3250.75)",pis:"Número do PIS/PASEP/NIT",agencia:"Agência bancária",operacao:"Operação da conta (Caixa)",conta:"Número da conta",
 avisos:"Observações curtas: documento ilegível, cortado, vencido, nomes diferentes entre documentos etc. Vazio se tudo ok"};
const DOC_PROMPT=`Você está ajudando uma corretora de imóveis a cadastrar um cliente para financiamento habitacional.
Leia as imagens/PDFs de documentos brasileiros enviados (RG, CNH, CPF, comprovante de residência, holerite/contracheque, carteira de trabalho, certidão de casamento, extrato do FGTS etc.).
Extraia apenas o que estiver escrito e legível. Nunca invente nem deduza. Se um campo não aparecer, deixe vazio.
Se houver vários documentos da mesma pessoa, junte as informações. Responda em português.`;
const PERS=["nome","cpf","rg","nasc","profissao","escolaridade","fone","email"];
async function toPart(f){
 if(/^image\//.test(f.type)){try{const bmp=await createImageBitmap(f),s=Math.min(1,1800/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return {inlineData:{mimeType:"image/jpeg",data:c.toDataURL("image/jpeg",.88).split(",")[1]}}}catch(e){}}
 const b=new Uint8Array(await f.arrayBuffer());let s="";for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));
 return {inlineData:{mimeType:f.type||"application/pdf",data:btoa(s)}}}
function norm(k,v){v=String(v??"").trim();if(!v)return"";const f=CFL[k];if(!f)return v;const t=f[2];
 if(t=="date"){const m=v.match(/(\d{1,2})\D(\d{1,2})\D(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:/^\d{4}-\d{2}-\d{2}$/.test(v)?v:""}
 if(t=="money"){const n=parseFloat(v.replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isNaN(n)?"":String(n)}
 if(t=="cpf")return mask.cpf(v);if(t=="cep")return mask.cep(v);if(t=="tel")return mask.tel(v);
 if(Array.isArray(t)){const o=t.filter(Boolean),lv=v.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  return o.find(x=>x.toLowerCase()==v.toLowerCase())||o.find(x=>{const lx=x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");return lx.startsWith(lv.slice(0,5))||lv.startsWith(lx.slice(0,5))})||""}
 if(k.endsWith("nome"))return v.toLowerCase().replace(/(^|\s)(\S)/g,(a,b,c)=>b+c.toUpperCase()).replace(/ (D[aeo]s?|E) /g,s=>s.toLowerCase());
 return v}
async function scanDoc(files,pre){files=[...files];if(!files.length||!FA)return;const fa=FA;
 const big=files.find(f=>f.size>20*1048576);if(big)return alert(`“${big.name}” é grande demais para leitura (máx. 20 MB).`);
 SCAN={busy:true,files,pre};$("#scanr").innerHTML=`<p class="meta" style="margin:12px 0 0"><span class="spin"></span>Lendo ${files.length>1?files.length+" arquivos":"o documento"}… pode levar alguns segundos.</p>`;
 let r;try{r=await window.lerDoc(files)}catch(e){console.error(e);if(FA!==fa)return;SCAN=null;
  $("#scanr").innerHTML=`<p class="err-box">Não consegui ler: ${esc(aiErr(e))}</p>`;return}
 if(FA!==fa)return;
 const rows=[];for(const [k,v] of Object.entries(r||{})){if(k=="tipoDocumento"||k=="avisos")continue;const key=pre&&PERS.includes(k)?pre+k:pre&&!PERS.includes(k)?null:k;if(!key||!CFL[key])continue;
  const nv=norm(key,v);if(!nv)continue;const cur=$("#c_"+key).value.trim();if(norm(key,cur)==nv)continue;rows.push([key,nv,cur])}
 const tipo=(r&&r.tipoDocumento||"").trim();SCAN={busy:false,files,pre,rows,tipo};
 $("#scanr").innerHTML=`<div class="conf"><div class="conf-h"><b>${tipo?esc(tipo):"Documento"}${pre?" · dependente":""}</b><span>Confira antes de usar. Desmarque o que estiver errado.</span></div>
 ${r&&r.avisos?`<p class="warn-box">${esc(r.avisos)}</p>`:""}
 ${rows.length?`<div class="conf-l">${rows.map(([k,nv,cur],i)=>`<label class="cr"><input type="checkbox" id="sk${i}" ${cur?"":"checked"}><span class="cl">${CFL[k][1].replace(/\?$/,"")}</span><span class="cv"><input id="sv${i}" value="${esc(nv)}" ${CFL[k][2]=="date"?'type="date"':""}>${cur?`<small>no cadastro: ${esc(fmtV(CFL[k],cur))} — marque para substituir</small>`:""}</span></label>`).join("")}</div>`:`<p class="meta">Nenhuma informação nova encontrada${r&&Object.values(r).some(Boolean)?" (o que foi lido já está no cadastro)":""}.</p>`}
 <label class="cr att-ck"><input type="checkbox" id="sk_att" checked><span>Anexar ${files.length>1?"os "+files.length+" arquivos":"o arquivo"} ao cadastro${tipo?` como “${esc(tipo)}”`:""}</span></label>
 <div class="row"><button class="btn p sm" onclick="applyScan()">Confirmar</button><button class="btn sm" onclick="SCAN=null;$('#scanr').innerHTML=''">Descartar</button></div></div>`;
 $("#scanr").scrollIntoView({block:"nearest",behavior:"smooth"})}
function applyScan(){if(!SCAN)return;let n=0;
 SCAN.rows.forEach(([k],i)=>{if(!$("#sk"+i).checked)return;const el=$("#c_"+k),v=$("#sv"+i).value;el.value=CFL[k][2]=="date"?v:norm(k,v)||v;el.closest("details").open=true;el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2400);n++});
 const att=$("#sk_att").checked;
 if(att){const tag=(SCAN.tipo||"Documento").replace(/[\\/:*?"<>|]+/g," ").slice(0,40)+(SCAN.pre?" (dependente)":"");addF(SCAN.files.map(f=>new File([f],`${tag} - ${f.name}`,{type:f.type})))}
 $("#scanr").innerHTML=`<p class="ok-box">${n?n+" campo(s) preenchido(s)":"Nenhum campo alterado"}${att?" e documento anexado":""}. Lembre de salvar.</p>`;SCAN=null}
function aiErr(e){const m=(e&&(e.code||"")+" "+(e.message||""))||"";
 if(/demo/i.test(m))return m;
 if(/api-not-enabled|not been used|disabled|SERVICE_DISABLED|firebasevertexai|firebaseml/i.test(m))return "o Firebase AI Logic ainda não foi ativado no projeto (Console do Firebase → AI Logic).";
 if(/app.?check|attestation/i.test(m))return "o App Check bloqueou. Coloque a chave do reCAPTCHA v3 no conexao.js (veja as instruções).";
 if(/quota|429|resource.?exhausted/i.test(m))return "limite gratuito atingido. Espere um minuto e tente de novo (o limite diário zera no dia seguinte).";
 if(/billing|blaze/i.test(m))return "este modelo pede plano pago. Troque o primeiro item de AI_MODELS no index.html por um modelo gratuito.";
 return m.slice(0,200)||"erro desconhecido"}

 const A=await import(V+"firebase-auth.js"),S=await import(V+"firebase-firestore.js");

 window.logout=()=>A.signOut(auth);
 window.put=(c,o)=>S.setDoc(path(c,o.id),o).catch(e=>alert("Erro ao salvar: "+e.code));
 window.rm=(c,id)=>S.deleteDoc(path(c,id)).catch(e=>alert("Erro ao excluir: "+e.code));
 /* arquivos guardados no próprio Firestore, em pedaços de até 900 KB (plano gratuito) */
 const CH=900*1024,fdoc=id=>S.doc(db,"users",auth.currentUser.uid,"arquivos",id);
 window.upload=async(id,blob,onp)=>{const buf=new Uint8Array(await blob.arrayBuffer()),n=Math.max(1,Math.ceil(buf.length/CH));onp(0);
  for(let i=0;i<n;i++){await S.setDoc(fdoc(id+"_"+i),{d:S.Bytes.fromUint8Array(buf.subarray(i*CH,(i+1)*CH)),i,n,tipo:blob.type||""});onp((i+1)/n)}
  return {path:`fs:${id}:${n}`}};
 window.unload=p=>{const m=/^fs:([^:]+):(\d+)$/.exec(p||"");if(!m)return;for(let i=0;i<+m[2];i++)S.deleteDoc(fdoc(m[1]+"_"+i)).catch(e=>console.warn("não apagou",e.code))};
 window.fetchBlob=async a=>{const m=/^fs:([^:]+):(\d+)$/.exec(a.path||"");if(!m)return null;
  const parts=await Promise.all([...Array(+m[2])].map((_,i)=>S.getDoc(fdoc(m[1]+"_"+i)).then(d=>{if(!d.exists())throw new Error("parte do arquivo faltando");return d.data().d.toUint8Array()})));
  return new Blob(parts,{type:a.tipo||""})};
 window.lerDoc=async files=>{
  const AI=await import(V+"firebase-ai.js"),ai=AI.getAI(auth.app,{backend:window.AI_BACKEND=="google"?new AI.GoogleAIBackend():new AI.VertexAIBackend("global")});
  const props={};for(const [k,d] of Object.entries(DOCF))props[k]=AI.Schema.string({description:d});
  const schema=AI.Schema.object({properties:props,optionalProperties:Object.keys(props)});
  const parts=await Promise.all(files.map(toPart));let last;
  for(const m of window.AI_MODELS){try{
   const model=AI.getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:"application/json",responseSchema:schema,temperature:0}});
   const r=await model.generateContent([DOC_PROMPT,...parts]);return JSON.parse(r.response.text())
  }catch(e){last=e;console.warn("modelo",m,e);if(!/not.?found|404|is not supported|unsupported model|invalid model/i.test(e.message||""))throw e}}
  throw last};
 A.onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];window.onAuth(u);
  if(u)[["imoveis","houses"],["clientes","clients"]].forEach(([c,k])=>un.push(S.onSnapshot(S.collection(db,"users",u.uid,c),s=>window.onData(k,s.docs.map(d=>d.data())),e=>window.onFail(e))))},e=>window.onFail(e));
}catch(e){console.error(e);window.onFail(e)}
</script>
</body></html>
