<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--fr);outline-offset:3px;border-radius:14px}.hero :focus-visible{outline-color:#fff}
.ic{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

@keyframes mq{to{transform:translateX(-50%)}}

.pc b{display:block;margin-top:16px;font:700 19px/1.2 var(--disp)}.pc span{font-size:14px;opacity:.95}.pp{font:700 24px var(--disp);margin-top:14px}
.fc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;padding:12px}

.fc input{flex:2 1 170px;width:auto}.fc select{flex:1 1 120px;width:auto}

.it:hover{transform:translateY(-3px)}.it:active{transform:scale(.98)}
.it::after,.sum::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(170px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--br) 14%,transparent),transparent 70%);opacity:0;transition:opacity .3s}.it:hover::after,.sum:hover::after{opacity:1}
.th{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font:700 24px var(--disp);transition:transform .55s var(--spring)}.th .ic{width:27px;height:27px}.it:hover .th{transform:rotate(-8deg) scale(1.08)}

.s0,.s8{--sc:var(--g)}.s1,.s7{--sc:var(--a)}.s2{--sc:var(--sl)}.s3,.s4{--sc:var(--b)}.s5{--sc:var(--p)}.s6{--sc:var(--t)}.s9{--sc:var(--rd)}
.ch{width:42px;height:42px;border-radius:50%;background:var(--in);display:grid;place-items:center;transition:transform .45s var(--spring),background .25s,color .25s}.it:hover .ch{background:var(--br);color:var(--onbr)}.it.open .ch{transform:rotate(90deg)}
.dt{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}.dt>div{overflow:hidden;visibility:hidden;transition:visibility 0s .5s}.it.open .dt{grid-template-rows:1fr}.it.open .dt>div{visibility:visible;transition-delay:0s}
.dt>div>div{border-top:1px dashed var(--line);margin-top:12px;padding-top:2px}
.tag{display:inline-block;padding:4px 13px;border-radius:99px;background:var(--in);font-size:13px;font-weight:500;margin:10px 6px 0 0}
.pr{font:700 26px var(--disp);color:var(--ac);margin-top:10px}.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;cursor:pointer;text-decoration:none;font-weight:600;font-size:15px;transition:transform .3s var(--spring),color .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .35s var(--ease);z-index:-1}.btn:hover{color:var(--cr)}.btn:hover::before{transform:none}.btn:active{transform:scale(.94)}
.btn.p{background:linear-gradient(135deg,#c94612,#a8350a);color:#fff;border-color:transparent}.btn.p:hover{color:#fff}.btn.p:hover::before{background:var(--fg)}.btn.d{color:var(--rd)}.btn.d:hover{color:#fff}.btn.d:hover::before{background:#b91c1c}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.mu{color:var(--mu);font-size:14px}.empty{text-align:center;color:var(--mu)}
.spin{width:38px;height:38px;margin:4px auto 12px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--br);animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.m{position:fixed;inset:0;background:rgba(5,30,24,.6);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-end;overflow:auto;padding:0 12px;z-index:9;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}.m.on{opacity:1;visibility:visible}
.m>div{position:relative;background:var(--card);border-radius:32px 32px 0 0;padding:30px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .6s cubic-bezier(.2,1.1,.3,1);outline:0}.m.on>div{transform:none}

@keyframes up{from{transform:translate(-50%,130px)}}

.out .nav,.out .fab{display:none}
#lmap{position:relative;z-index:0;isolation:isolate;height:480px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}

/* ===== tema pôr do sol: gradientes, vidro e montanhas ===== */
:root{--bg:#f1edfb;--ink:#17123a;--mu:#5a5478;--line:rgba(60,40,120,.12);--fg:#24175e;--br:#6d33b8;--fr:#6d33b8;--in:#f5f2fd;--sh:0 18px 36px -18px rgba(76,40,160,.45),0 2px 6px rgba(76,40,160,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0b24;--card:#1a1438;--cr:#1a1438;--ink:#ede9ff;--mu:#aaa3cf;--line:rgba(255,255,255,.1);--fg:#120c33;--br:#b69cff;--onbr:#1a1040;--fr:#c4b0ff;--in:#140f30;--sh:0 18px 36px -18px rgba(0,0,0,.8)}}
body{min-height:100vh;background:radial-gradient(800px 520px at 105% 0,rgba(255,154,90,.2),transparent 60%),radial-gradient(760px 620px at -10% 45%,rgba(109,51,184,.16),transparent 60%),var(--bg)}
.mq{color:#d9ccff}
.hero{padding-bottom:116px;background:linear-gradient(165deg,#24175e 0%,#5b2bab 40%,#c2478a 78%,#ff9a5a 100%)}
.hero::before{background:radial-gradient(circle,rgba(120,200,255,.42),transparent 65%)}.hero::after{background:radial-gradient(circle,rgba(255,170,90,.5),transparent 65%)}
.mt{position:absolute;left:0;right:0;bottom:0;width:100%;height:132px;z-index:-1}
.mt path:nth-of-type(1){translate:0 calc(var(--sy,0)*.1px)}.mt path:nth-of-type(2){translate:0 calc(var(--sy,0)*.05px)}
.sun{filter:drop-shadow(0 0 14px rgba(255,200,140,.95));transform-box:fill-box;transform-origin:center;animation:sun 6s ease-in-out infinite alternate}@keyframes sun{to{transform:scale(1.2);opacity:.85}}
.sum,.fc{background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-color:rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){.sum,.fc{border-color:var(--line)}}
.it{background:color-mix(in srgb,var(--card) 90%,transparent)}
.sum>div:nth-child(1){--gq:linear-gradient(160deg,#8b5cf6,#4c2fb8)}.sum>div:nth-child(2){--gq:linear-gradient(160deg,#14b8a6,#0b6b5e)}.sum>div:nth-child(3){--gq:linear-gradient(160deg,#f0662a,#b3205f)}

function fh(id){const h=D.houses.find(x=>x.id==id)||{tipo:"Casa",status:"Disponível"};
 openM(`<h3>${id?"Editar":"Novo"} imóvel</h3><div class="f">${inp("a1","Título",h.titulo,"text","full")}
 <div><label>Tipo</label><select id="a2">${opts(TIPOS,h.tipo)}</select></div><div><label>Status</label><select id="a3">${opts(SH,h.status)}</select></div>
 ${inp("a4","Endereço",h.endereco,"text","full")}${inp("a5","Bairro",h.bairro)}${inp("a6","Cidade",h.cidade)}
 ${inp("a7","Preço (R$)",h.preco,"number")}${inp("a8","Área (m²)",h.area,"number")}${inp("a9","Quartos",h.quartos,"number")}${inp("b1","Proprietário",h.dono)}${inp("b2","Telefone do proprietário",h.fone)}
 <div class="full"><label>Localização GPS (cole “lat, lng” do Google Maps)</label><input id="b3" value="${h.ll?h.ll.join(", "):""}"><button class="btn" style="margin-top:8px" onclick="gps()">${I("pin")}Usar minha localização atual</button></div>

function sh(id){const o={id:id||uid(),titulo:$("#a1").value,tipo:$("#a2").value,status:$("#a3").value,endereco:$("#a4").value,bairro:$("#a5").value,cidade:$("#a6").value,preco:$("#a7").value,area:$("#a8").value,quartos:$("#a9").value,dono:$("#b1").value,fone:$("#b2").value,ll:parseLL($("#b3").value),obs:$("#b4").value};
 if($("#b3").value&&!o.ll)return alert("Coordenadas inválidas. Use o formato: -5.1234, -40.5678");closeM();put("imoveis",o)}

 if(!o.nome)return alert("Informe o nome.");closeM();put("clientes",o)}

const tg=e=>{e.setAttribute("aria-expanded",e.classList.toggle("open"))},kd=(e,t)=>{if(e.target===t&&(e.key=="Enter"||e.key==" ")){e.preventDefault();tg(t)}};
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".btn,.svc button");if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,p=document.createElement("span");p.className="rp";p.style.cssText="width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";b.appendChild(p);setTimeout(()=>p.remove(),650)});

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module">
const g=id=>document.getElementById(id);
try{
 const {auth,db}=await import("./conexao.js"),V="https://www.gstatic.com/firebasejs/10.12.2/";
 const A=await import(V+"firebase-auth.js"),S=await import(V+"firebase-firestore.js");
 let un=[];const path=(c,id)=>S.doc(db,"users",auth.currentUser.uid,c,id);
 window.login=async()=>{try{await A.signInWithEmailAndPassword(auth,g("em").value,g("pw").value)}catch(e){alert("E-mail ou senha incorretos.")}};
 window.logout=()=>A.signOut(auth);
 window.put=(c,o)=>S.setDoc(path(c,o.id),o).catch(e=>alert("Erro ao salvar: "+e.code));
 window.rm=(c,id)=>S.deleteDoc(path(c,id)).catch(e=>alert("Erro ao excluir: "+e.code));
 A.onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];window.onAuth(u);
  if(u)[["imoveis","houses"],["clientes","clients"]].forEach(([c,k])=>un.push(S.onSnapshot(S.collection(db,"users",u.uid,c),s=>window.onData(k,s.docs.map(d=>d.data())),e=>window.onFail(e))))},e=>window.onFail(e));
}catch(e){console.error(e);window.onFail(e)}
</script>
