<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darling Soares"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Darling Soares · Corretora de Imóveis</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{color-scheme:light;
/* Elegante imobiliário: papel marfim quente, tinta grafite (o cinza do S), laranja da marca (o D) só nos destaques.
   Layout: título grande, cartões com foto, barra de abas flutuante de vidro. */
--paper:#f6f2ec;--sheet:#fff;--soft:#efe8de;--ink:#1d1b18;--ink2:#4b4741;--mu:#8b847a;--line:#e8e0d5;--line2:#d7cdbf;
--ac:#e8611c;--act:#c4500f;--onac:#fff;--ok:#3f7a3a;--warn:#a8701a;--info:#3b5f86;--bad:#b3341f;--band:#1d1b18;
--champ:#b08a5a;--vidro:rgba(255,253,250,.72);--vidro-borda:rgba(255,255,255,.85);--vidro-luz:rgba(255,255,255,.95);
--sombra:0 18px 40px -22px rgba(52,38,20,.35),0 2px 6px -2px rgba(52,38,20,.08);--pill:#1d1b18;--onpill:#fff;
--mola:cubic-bezier(.32,.72,0,1);--ressalto:cubic-bezier(.34,1.56,.64,1);
--serif:"Fraunces",Georgia,"Times New Roman",serif;--wide:"Manrope",var(--sans);--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
--paper:#12100e;--sheet:#1c1916;--soft:#27231f;--ink:#f4eee6;--ink2:#d2c9bd;--mu:#9a9184;--line:#2d2824;--line2:#3d3630;
--ac:#f07a35;--act:#ff9c5e;--band:#0d0c0a;--vidro:rgba(34,30,26,.66);--vidro-borda:rgba(255,255,255,.1);--vidro-luz:rgba(255,255,255,.18);
--sombra:0 18px 40px -20px rgba(0,0,0,.8);--pill:#f4eee6;--onpill:#1d1b18;--champ:#cfa874}}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}

/* topo */
.band{background:var(--band);color:#bdbdbd;border-bottom:3px solid var(--ac)}
.top{display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;font-size:13px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.brand img{height:40px;width:auto;display:block}
.brand b{display:block;font:600 19px/1 var(--serif);letter-spacing:.01em;color:#fff}
.brand small{display:block;margin-top:4px;font:400 10px var(--wide);letter-spacing:.28em;color:#a9a9a9;text-transform:uppercase}
.top .who{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9a9a9a}
.top button{background:none;border:1px solid #3a3a3a;border-radius:5px;padding:6px 12px;color:#ddd;cursor:pointer;font-size:13px}
.top button:hover{border-color:var(--ac);color:#fff}
@media (max-width:520px){.top .who{display:none}.top button{margin-left:auto}.brand img{height:34px}.brand b{font-size:17px}}
.head{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;padding:28px 0 18px;border-bottom:2px solid var(--ink)}
.eyebrow{display:block;font:500 11px var(--wide);letter-spacing:.24em;text-transform:uppercase;color:var(--act)}
h1{font:600 clamp(34px,8vw,50px)/1.02 var(--serif);letter-spacing:-.01em;margin:8px 0 0}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.out .top .who,.out .top button,.out .nav{display:none}
.out .band{display:none}
.biglogo{display:block;width:min(300px,72vw);height:auto;margin:6vh auto 8px}
.out .head{justify-content:center;text-align:center;border-bottom:0;padding-top:10px}
.out .box{margin-left:auto;margin-right:auto}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;max-width:150px;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mu);cursor:pointer}
.nav button .ic{width:20px;height:20px}
.nav button.on{color:var(--act);border-top-color:var(--ac)}
@media (min-width:860px){
 body{padding-bottom:40px}
 .nav{position:static;justify-content:flex-start;gap:26px;background:none;border:0;max-width:780px;margin:0 auto;padding:10px 20px 0}
 .nav button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:8px 0;border-top:0;border-bottom:2px solid transparent;margin:0}
 .nav button .ic{width:16px;height:16px}
 .nav button.on{border-bottom-color:var(--ac)}
}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:600}
.btn.p:hover{background:var(--act);border-color:var(--act)}
.btn.d{background:none;border-color:transparent;color:var(--bad);margin-left:auto}
.btn.d:hover{text-decoration:underline}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn .ic{width:16px;height:16px}
.lnk{background:none;border:0;padding:0;font-size:13px;color:var(--mu);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ac)}
input,select,textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line2);border-radius:5px;background:var(--sheet);outline:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}

/* início */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats>div{padding:20px 0 18px 18px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font:600 42px/1 var(--serif);color:var(--ink);font-variant-numeric:lining-nums}
.stats span{font-size:13px;color:var(--mu)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec h2{margin:0;font:600 21px var(--serif)}
.types{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:12px}
.types button{background:none;border:0;padding:4px 0;font-size:14px;color:var(--ink2);cursor:pointer}
.types button:hover{color:var(--ac)}
.types small{color:var(--mu);margin-left:5px;font-variant-numeric:tabular-nums}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;padding:13px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.ln>span{font:600 17px/1.3 var(--serif)}
.ln small{grid-column:1;font-size:13px;color:var(--mu)}
.ln b{grid-row:1/3;grid-column:2;align-self:center;font:600 16px var(--serif);text-align:right}
.ln:hover>span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.empty{padding:28px 0;color:var(--mu)}

/* listas */
.fc{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.fc input{flex:2 1 200px;width:auto}.fc select{flex:1 1 140px;width:auto}
.count{font-size:13px;color:var(--mu);margin:14px 0 0}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:0 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.th{width:52px;height:52px;border-radius:4px;background:var(--soft);color:var(--ink2);display:grid;place-items:center;overflow:hidden;font:600 20px var(--serif)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ic{width:22px;height:22px}
.tx{min-width:0}
.it h3{margin:0;font:600 18px/1.25 var(--serif);overflow-wrap:anywhere}
.it:hover h3{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.meta{font-size:13px;color:var(--mu)}
.rt{text-align:right}
.pr{font:600 17px var(--serif);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sc,var(--mu));white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.clip{display:inline-flex;align-items:center;gap:3px;margin-left:8px;color:var(--mu)}
.clip .ic{width:13px;height:13px}
.dt{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.dt>div{overflow:hidden}
.it.open .dt{grid-template-rows:1fr}
.dd{padding:16px 0 4px;cursor:default}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 22px}
.kv small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.kv div{overflow-wrap:anywhere}
.obs{margin:14px 0 0;color:var(--ink2);white-space:pre-line}
.lbl{margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

/* anexos */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.gal button{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--soft);cursor:zoom-in}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block}
.gal .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.25)}
.gal .pl .ic{width:26px;height:26px;fill:#fff;stroke:none}
.docs{border-top:1px solid var(--line)}
.doc{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;text-decoration:none}
.doc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc small{color:var(--mu);font-size:12px;white-space:nowrap}
.doc:hover span{text-decoration:underline;text-underline-offset:3px}
.doc .ic{color:var(--mu)}
.att{margin-top:6px;border:1px dashed transparent;border-radius:6px;transition:border-color .15s,background .15s}
.att.drag{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}
.hint{margin:4px 0 0;font-size:13px;color:var(--mu)}
.ai{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ai:first-child{margin-top:12px;border-top:1px solid var(--line)}
.ait{width:40px;height:40px;border-radius:3px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--mu)}
.ait img{width:100%;height:100%;object-fit:cover}
.ain{min-width:0}.ain b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ain small{font-size:12px;color:var(--mu)}.ain .err{color:var(--bad)}
.bar{display:block;height:3px;margin-top:5px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .2s}
.x{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:4px;color:var(--mu);cursor:pointer}
.x:hover{background:var(--soft);color:var(--bad)}

/* janelas */
.m,.vw{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:6vh 12px 24px;background:rgba(24,20,14,.45);opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.m.on,.vw.on{opacity:1;visibility:visible}
.m>div{width:100%;max-width:620px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:26px 24px 22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);outline:0}
.m h3{margin:0 0 18px;font:600 28px/1.1 var(--serif)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f label{display:block;margin-bottom:4px;font-size:13px;font-weight:500;color:var(--ink2)}
.f .full{grid-column:1/-1}
.dims{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}@media (max-width:360px){.dims{grid-template-columns:1fr}}
.f label.btn{display:inline-flex;margin:0;color:var(--ink);font-size:13px}
.fh{grid-column:1/-1;margin-top:10px;padding-top:16px;border-top:1px solid var(--line);font:600 17px var(--serif)}
@media (max-width:360px){.f{grid-template-columns:1fr}}@media (max-width:480px){.m{padding:0;align-items:flex-end}.m>div{border-radius:10px 10px 0 0;max-height:94vh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.vw{background:rgba(10,9,7,.92);align-items:center;flex-direction:column;gap:14px}
.vw img,.vw video{max-width:100%;max-height:80vh;display:block;border-radius:3px}
.vw .bt{display:flex;gap:10px;align-items:center;color:#eee;font-size:13px;max-width:100%}
.vw .bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw .btn{background:transparent;color:#eee;border-color:rgba(255,255,255,.3)}

/* mapa e diversos */
#lmap{height:480px;margin-top:20px;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;z-index:0}
.leaflet-popup-content-wrapper{border-radius:6px;background:var(--sheet);color:var(--ink);font-family:var(--sans)}.leaflet-popup-tip{background:var(--sheet)}

.pn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}.pn .ic{width:15px;height:15px}
.box{max-width:400px;margin:30px 0}.box label{display:block;margin:14px 0 4px;font-size:13px;font-weight:500;color:var(--ink2)}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}@keyframes sp{to{transform:rotate(360deg)}}

/* ficha do cliente e leitura de documentos */
.fs{border-top:1px solid var(--line);padding-top:4px}
.fs summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:12px 0 8px;font:600 17px var(--serif)}
.fs summary::-webkit-details-marker{display:none}
.fs summary::before{content:"+";width:14px;font:400 18px var(--sans);color:var(--mu)}
.fs[open] summary::before{content:"–"}
.fgq{display:inline-flex;align-items:center;gap:12px;margin-left:18px;font:500 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);cursor:default}
.fgq b{font-weight:600}
.yn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0}
.yn i{width:17px;height:17px;border:1.5px solid var(--line2);border-radius:3px;background:var(--sheet);display:grid;place-items:center}
.yn[aria-checked=true] i{background:var(--ac);border-color:var(--ac)}
.yn[aria-checked=true] i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.yn:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
@media (max-width:420px){.fs summary{flex-wrap:wrap}.fgq{margin-left:0;flex-basis:100%;order:3;padding-left:24px}}
.fs summary small{margin-left:auto;font:400 12px var(--sans);color:var(--mu)}
.fs>.f{padding:4px 0 14px 24px}
@media (max-width:480px){.fs>.f{padding-left:0}}
.fhint{display:block;min-height:0;font-size:12px;color:var(--bad);margin-top:3px}
input.hl,select.hl{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--sheet))}
.scan{margin:0 0 18px;padding:14px 16px;background:var(--soft);border-radius:6px}
.scan-t b{display:block;font:600 16px var(--serif)}.scan-t span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.scan label.btn{display:inline-flex}
.conf{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.conf-h b{display:block;font:600 16px var(--serif)}.conf-h span{font-size:13px;color:var(--mu)}
.conf-l{margin-top:10px;border-top:1px solid var(--line2)}
.cr{display:grid;grid-template-columns:22px 130px 1fr;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
.cr>input[type=checkbox]{width:18px;height:18px;min-height:0;margin:0;accent-color:var(--ac)}
.cl{color:var(--ink2);font-size:13px}
.cv input{min-height:36px;padding:6px 10px;font-size:14px}
.cv small{display:block;font-size:12px;color:var(--warn);margin-top:3px}
.att-ck{grid-template-columns:22px 1fr;border-bottom:0;margin-top:6px}
@media (max-width:480px){.cr{grid-template-columns:22px 1fr}.cr .cv{grid-column:2}}
.err-box,.warn-box,.ok-box{margin:12px 0 0;padding:9px 12px;border-radius:5px;font-size:13px}
.err-box{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.warn-box{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)}
.ok-box{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)}

/* =====================================================================================================
   App (18/11/2026): visual elegante imobiliário. Fica por cima do estilo de cima, sem mudar as funções.
   ===================================================================================================== */
html{-webkit-tap-highlight-color:transparent}
body{background:var(--paper);font-size:15px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (display-mode:standalone){body{overscroll-behavior-y:contain}}

/* topo: barra de vidro fixa; o título pequeno aparece quando o grande sai da tela */
.band{position:sticky;top:0;z-index:15;background:transparent;border-bottom:1px solid transparent;color:var(--ink2);transition:background-color .3s,border-color .3s}
.band.rolou{background:var(--vidro);border-bottom-color:var(--line);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.top{min-height:58px;padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;position:relative}
.brand{color:var(--ink);transition:opacity .25s}
.brand img{height:36px;width:36px;border-radius:11px;box-shadow:0 4px 12px -4px rgba(52,38,20,.35)}
.brand span{transition:opacity .25s}
.brand b{font:600 18px/1 var(--serif);color:var(--ink);letter-spacing:-.01em}
.brand small{font:600 9.5px var(--wide);letter-spacing:.24em;color:var(--mu)}
.titulo-barra{position:absolute;left:50%;transform:translate(-50%,6px);font:600 16px var(--serif);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--mola);white-space:nowrap}
.band.com-titulo .titulo-barra{opacity:1;transform:translate(-50%,0)}
.band.com-titulo .brand span{opacity:0}
.top .who{color:var(--mu)}
.top button{border:1px solid var(--line2);border-radius:999px;padding:7px 14px;color:var(--ink2);background:var(--sheet);font-weight:600;transition:transform .3s var(--ressalto)}
.top button:active{transform:scale(.92)}
@media (max-width:520px){.top .who{display:none}.brand img{height:34px;width:34px}.brand b{font-size:17px}}

/* cabeçalho da tela: título grande */
.head{border-bottom:0;padding:18px 0 14px;align-items:flex-end}
.eyebrow{font:700 11px var(--wide);letter-spacing:.2em;color:var(--champ)}
h1{font:600 clamp(36px,9.5vw,52px)/1 var(--serif);letter-spacing:-.025em;margin-top:6px;font-variation-settings:"opsz" 144}

function startFA(col,rec){FA={col,id:rec.id||uid(),list:(rec.att||[]).map(a=>({...a,st:"ok"})),added:[],removed:[],dead:false}}
function addF(files){const fa=FA;if(!fa)return;for(const f of files){
 const img=/^image\/(jpeg|png|webp|heic|heif|bmp)/i.test(f.type);
 if(!img&&f.size>MAXMB*1048576){alert(`“${f.name}” tem ${fsz(f.size)}. O limite é ${MAXMB} MB${/^video/.test(f.type)?" — grave um vídeo mais curto ou envie pelo WhatsApp":""}.`);continue}
 const a={id:uid(),nome:f.name,tipo:f.type||"",tam:f.size,st:"up",pct:0,prev:img?URL.createObjectURL(f):""};
 fa.list.push(a);fa.added.push(a.id);
 (async()=>{let blob=f;
  if(img){try{blob=await shrink(f,2000,.82);a.tipo="image/jpeg";if(!/\.jpe?g$/i.test(a.nome))a.nome=a.nome.replace(/\.[^.]+$/,"")+".jpg";a.thumb=await b2url(await shrink(f,240,.6))}catch(e){console.warn(e);blob=f}}
  a.tam=blob.size;if(blob.size>MAXMB*1048576)throw {message:`continua grande demais (${fsz(blob.size)})`};
  const r=await window.upload(a.id,blob,p=>{a.pct=p;if(FA===fa)drawAtt()});
  if(fa.dead){window.unload(r.path);return}a.path=r.path;a.st="ok";if(FA===fa)drawAtt()})()
  .catch(e=>{console.error(e);a.st="err";a.err=e.code=="permission-denied"?"sem permissão (regras do Firestore)":e.code=="resource-exhausted"?"cota gratuita do dia esgotada, tente amanhã":(e.code||e.message||"erro");if(FA===fa)drawAtt()})}
 drawAtt()}
function drawAtt(){const el=$("#al");if(!el||!FA)return;
 el.innerHTML=FA.list.map(a=>`<div class="ai"><span class="ait">${isImg(a)&&(a.prev||a.thumb||a.url)?`<img src="${esc(a.prev||a.thumb||a.url)}" alt="">`:I(isVid(a)?"video":"file")}</span><div class="ain"><b>${esc(a.nome)}</b>${a.st=="up"?`<small>Enviando… ${Math.round(a.pct*100)}%</small><i class="bar"><i style="width:${Math.round(a.pct*100)}%"></i></i>`:a.st=="err"?`<small class="err">Não enviou: ${esc(a.err)}</small>`:`<small>${isMed(a)?(isImg(a)?"Foto":"Vídeo"):"Documento"} · ${fsz(a.tam)}</small>`}</div>${a.st=="up"?"<span></span>":`<button type="button" class="x" onclick="rmA('${a.id}')" aria-label="Remover ${esc(a.nome)}">${I("x")}</button>`}</div>`).join("")}
function rmA(id){const a=FA.list.find(x=>x.id==id);if(!a)return;FA.list=FA.list.filter(x=>x.id!=id);
 if(a.path){FA.added.includes(id)?window.unload(a.path):FA.removed.push(a.path)}drawAtt()}
function attOut(){if(FA.list.some(a=>a.st=="up")){alert("Espere os arquivos terminarem de enviar.");return null}
 return FA.list.filter(a=>a.st=="ok").map(({id,nome,tipo,tam,path,thumb,url})=>Object.assign({id,nome,tipo,tam,path},thumb?{thumb}:{},url?{url}:{})).map((x,i,all)=>{/* cadastro tem limite de 1 MB: miniaturas além de ~600 KB somem */let t=0;for(let j=0;j<=i;j++)t+=(all[j].thumb||"").length;if(t>600000)delete x.thumb;return x})}
function cancelFA(){const fa=FA;FA=null;fa.dead=true;fa.list.forEach(a=>{if(fa.added.includes(a.id)&&a.path)window.unload(a.path)})}

function norm(k,v){v=String(v??"").trim();if(!v)return"";const f=CFL[k];if(!f)return v;const t=f[2];
 if(t=="date"){const m=v.match(/(\d{1,2})\D(\d{1,2})\D(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:/^\d{4}-\d{2}-\d{2}$/.test(v)?v:""}
 if(t=="money"){const n=parseFloat(v.replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isNaN(n)?"":String(n)}
 if(t=="cpf")return mask.cpf(v);if(t=="cep")return mask.cep(v);if(t=="tel")return mask.tel(v);
 if(Array.isArray(t)){const o=t.filter(Boolean),lv=v.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  return o.find(x=>x.toLowerCase()==v.toLowerCase())||o.find(x=>{const lx=x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");return lx.startsWith(lv.slice(0,5))||lv.startsWith(lx.slice(0,5))})||""}
 if(k.endsWith("nome"))return v.toLowerCase().replace(/(^|\s)(\S)/g,(a,b,c)=>b+c.toUpperCase()).replace(/ (D[aeo]s?|E) /g,s=>s.toLowerCase());
 return v}
async function scanDoc(files,pre){files=[...files];if(!files.length||!FA)return;const fa=FA;
 const big=files.find(f=>f.size>20*1048576);if(big)return alert(`“${big.name}” é grande demais para leitura (máx. 20 MB).`);
 SCAN={busy:true,files,pre};$("#scanr").innerHTML=`<p class="meta" style="margin:12px 0 0"><span class="spin"></span>Lendo ${files.length>1?files.length+" arquivos":"o documento"}… pode levar alguns segundos.</p>`;
 let r;try{r=await window.lerDoc(files)}catch(e){console.error(e);if(FA!==fa)return;SCAN=null;
  $("#scanr").innerHTML=`<p class="err-box">Não consegui ler: ${esc(aiErr(e))}</p>`;return}
 if(FA!==fa)return;
 const rows=[];for(const [k,v] of Object.entries(r||{})){if(k=="tipoDocumento"||k=="avisos")continue;const key=pre&&PERS.includes(k)?pre+k:pre&&!PERS.includes(k)?null:k;if(!key||!CFL[key])continue;
  const nv=norm(key,v);if(!nv)continue;const cur=$("#c_"+key).value.trim();if(norm(key,cur)==nv)continue;rows.push([key,nv,cur])}
 const tipo=(r&&r.tipoDocumento||"").trim();SCAN={busy:false,files,pre,rows,tipo};
 $("#scanr").innerHTML=`<div class="conf"><div class="conf-h"><b>${tipo?esc(tipo):"Documento"}${pre?" · dependente":""}</b><span>Confira antes de usar. Desmarque o que estiver errado.</span></div>
 ${r&&r.avisos?`<p class="warn-box">${esc(r.avisos)}</p>`:""}
 ${rows.length?`<div class="conf-l">${rows.map(([k,nv,cur],i)=>`<label class="cr"><input type="checkbox" id="sk${i}" ${cur?"":"checked"}><span class="cl">${CFL[k][1].replace(/\?$/,"")}</span><span class="cv"><input id="sv${i}" value="${esc(nv)}" ${CFL[k][2]=="date"?'type="date"':""}>${cur?`<small>no cadastro: ${esc(fmtV(CFL[k],cur))} — marque para substituir</small>`:""}</span></label>`).join("")}</div>`:`<p class="meta">Nenhuma informação nova encontrada${r&&Object.values(r).some(Boolean)?" (o que foi lido já está no cadastro)":""}.</p>`}
 <label class="cr att-ck"><input type="checkbox" id="sk_att" checked><span>Anexar ${files.length>1?"os "+files.length+" arquivos":"o arquivo"} ao cadastro${tipo?` como “${esc(tipo)}”`:""}</span></label>
 <div class="row"><button class="btn p sm" onclick="applyScan()">Confirmar</button><button class="btn sm" onclick="SCAN=null;$('#scanr').innerHTML=''">Descartar</button></div></div>`;
 $("#scanr").scrollIntoView({block:"nearest",behavior:"smooth"})}
function applyScan(){if(!SCAN)return;let n=0;
 SCAN.rows.forEach(([k],i)=>{if(!$("#sk"+i).checked)return;const el=$("#c_"+k),v=$("#sv"+i).value;el.value=CFL[k][2]=="date"?v:norm(k,v)||v;el.closest("details").open=true;el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2400);n++});
 const att=$("#sk_att").checked;
 if(att){const tag=(SCAN.tipo||"Documento").replace(/[\\/:*?"<>|]+/g," ").slice(0,40)+(SCAN.pre?" (dependente)":"");addF(SCAN.files.map(f=>new File([f],`${tag} - ${f.name}`,{type:f.type})))}
 $("#scanr").innerHTML=`<p class="ok-box">${n?n+" campo(s) preenchido(s)":"Nenhum campo alterado"}${att?" e documento anexado":""}. Lembre de salvar.</p>`;SCAN=null}
function aiErr(e){const m=(e&&(e.code||"")+" "+(e.message||""))||"";
 if(/demo/i.test(m))return m;
 if(/api-not-enabled|not been used|disabled|SERVICE_DISABLED|firebasevertexai|firebaseml/i.test(m))return "o Firebase AI Logic ainda não foi ativado no projeto (Console do Firebase → AI Logic).";
 if(/app.?check|attestation/i.test(m))return "o App Check bloqueou. Coloque a chave do reCAPTCHA v3 no conexao.js (veja as instruções).";
 if(/quota|429|resource.?exhausted/i.test(m))return "limite gratuito atingido. Espere um minuto e tente de novo (o limite diário zera no dia seguinte).";
 if(/billing|blaze/i.test(m))return "este modelo pede plano pago. Troque o primeiro item de AI_MODELS no index.html por um modelo gratuito.";
 return m.slice(0,200)||"erro desconhecido"}

/* ===== compartilhar cadastro em mensagem ===== */
function textoImovel(h){const L=[`*${h.titulo||"Imóvel"}*`],add=(k,v)=>{if(v!==""&&v!=null)L.push(`*${k}:* ${v}`)};
 add("Tipo",h.tipo);add("Situação",h.status);add("Preço",h.preco?money(h.preco):"");
 add("Endereço",[h.endereco,h.bairro,h.cidade].filter(Boolean).join(", "));
 add("Medidas",(h.largura||h.comprimento)?`${h.largura?nf(h.largura):"—"} m × ${h.comprimento?nf(h.comprimento):"—"} m`:"");
 add("Área",h.area?nf(h.area)+" m²":"");add("Quartos",h.quartos);
 add("Proprietário",h.dono);add("Telefone do proprietário",h.fone);
 if(h.ll)add("Localização",`https://www.google.com/maps?q=${h.ll[0]},${h.ll[1]}`);
 if(h.obs)L.push("",h.obs);
 const n=(h.att||[]).length;if(n)L.push("",`(${n} anexo(s) no cadastro)`);
 return L.join("\n")}
function textoCliente(c){const L=[`*${c.nome||"Cliente"}*`];
 if(c.fgts)L.push(`*FGTS:* ${c.fgts}`);
 CF.forEach(([t,fs])=>{const p=fs.filter(f=>f[0][0]!="_"&&!["nome","obs","fgts"].includes(f[0])&&c[f[0]]!=null&&c[f[0]]!=="");
  if(!p.length)return;L.push("",`— ${t.toUpperCase()} —`);p.forEach(f=>L.push(`${f[1].replace(/\?$/,"").replace(" (R$)","")}: ${fmtV(f,c[f[0]])}`))});
 if(c.obs)L.push("","— OBSERVAÇÕES —",c.obs);
 const n=(c.att||[]).length;if(n)L.push("",`(${n} documento(s) anexado(s) no cadastro)`);
 return L.join("\n")}
let SHR=null;
function shareRec(k,id){const o=(k=="h"?D.houses:D.clients).find(x=>x.id==id);if(!o)return;
 const med=(o.att||[]).filter(isMed),docs=(o.att||[]).filter(a=>!isMed(a));SHR={k,o};
 const canFiles=!!(navigator.canShare&&navigator.share);
 openM(`<h3>Compartilhar ${k=="h"?"imóvel":"cliente"}</h3>
 <p class="hint" style="margin:0 0 8px">Confira o texto — você pode apagar o que não quiser enviar.</p>
 <textarea id="shtx" rows="14" style="font-size:14px;line-height:1.45">${esc(k=="h"?textoImovel(o):textoCliente(o))}</textarea>
 ${k=="c"?`<p class="hint" style="color:var(--warn)">Atenção: a mensagem inclui dados pessoais (CPF, RG, renda…). Envie só para quem precisa.</p>`:""}
 ${canFiles&&(o.att||[]).length?`<label class="ck" style="display:flex;gap:9px;align-items:center;margin-top:12px;font-size:14px;cursor:pointer"><input type="checkbox" id="shf" style="width:18px;height:18px;min-height:0" ${med.length?"checked":""}> Enviar junto ${med.length?`as ${med.length} foto(s)/vídeo(s)`:""}${med.length&&docs.length?" e ":""}${docs.length?`os ${docs.length} documento(s)`:""}</label>`:""}
 <div class="row" style="margin-top:18px">${navigator.share?`<button class="btn p" onclick="shareGo()">${I("share")}Compartilhar…</button>`:""}<button class="btn ${navigator.share?"":"p"}" onclick="window.open('https://wa.me/?text='+encodeURIComponent($('#shtx').value),'_blank')">${I("chat")}WhatsApp</button><button class="btn" onclick="shareCopy()">${I("copy")}Copiar texto</button><button class="btn" onclick="closeM()">Fechar</button></div>
 <p class="hint" id="shst"></p>`)}
async function shareCopy(){const t=$("#shtx").value;try{await navigator.clipboard.writeText(t)}catch(e){$("#shtx").select();document.execCommand("copy")}$("#shst").textContent="Texto copiado. Cole onde quiser."}
async function shareGo(){const t=$("#shtx").value,o=SHR&&SHR.o,data={text:t};
 try{if($("#shf")&&$("#shf").checked&&o){$("#shst").textContent="Preparando os arquivos…";
   const files=[];for(const a of o.att||[]){try{const u=await fileURL(a),b=await (await fetch(u)).blob();files.push(new File([b],a.nome,{type:a.tipo||b.type}))}catch(e){console.warn(e)}}
   if(files.length&&navigator.canShare({files}))data.files=files;else if(files.length)$("#shst").textContent="Este aparelho não aceita enviar esses arquivos; vai só o texto."}
  await navigator.share(data);$("#shst").textContent=""}
 catch(e){if(e.name!="AbortError"){$("#shst").textContent="Não deu para compartilhar por aqui. Use “WhatsApp” ou “Copiar texto”.";console.warn(e)}else $("#shst").textContent=""}}

render();

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module">
const g=id=>document.getElementById(id);
try{
 const {auth,db}=await import("./conexao.js"),V="https://www.gstatic.com/firebasejs/12.19.0/";
 const A=await import(V+"firebase-auth.js"),S=await import(V+"firebase-firestore.js");
 let un=[];const path=(c,id)=>S.doc(db,"users",auth.currentUser.uid,c,id);
 window.login=async()=>{const em=g("em").value.trim(),pw=g("pw").value,b=g("entrar");
  if(!em){window.erroLogin("auth/invalid-email");return}if(!pw){window.erroLogin("auth/missing-password");return}
  b.disabled=true;b.textContent="Entrando…";
  try{await A.signInWithEmailAndPassword(auth,em,pw)}catch(e){window.erroLogin(e.code)}finally{if(g("entrar")){b.disabled=false;b.textContent="Entrar"}}};
 window.logout=()=>A.signOut(auth);
 window.put=(c,o)=>S.setDoc(path(c,o.id),o).catch(e=>alert("Erro ao salvar: "+e.code));
 window.rm=(c,id)=>S.deleteDoc(path(c,id)).catch(e=>alert("Erro ao excluir: "+e.code));
 /* arquivos guardados no próprio Firestore, em pedaços de até 900 KB (plano gratuito) */
 const CH=900*1024,fdoc=id=>S.doc(db,"users",auth.currentUser.uid,"arquivos",id);
 window.upload=async(id,blob,onp)=>{const buf=new Uint8Array(await blob.arrayBuffer()),n=Math.max(1,Math.ceil(buf.length/CH));onp(0);
  for(let i=0;i<n;i++){await S.setDoc(fdoc(id+"_"+i),{d:S.Bytes.fromUint8Array(buf.subarray(i*CH,(i+1)*CH)),i,n,tipo:blob.type||""});onp((i+1)/n)}
  return {path:`fs:${id}:${n}`}};
 window.unload=p=>{const m=/^fs:([^:]+):(\d+)$/.exec(p||"");if(!m)return;for(let i=0;i<+m[2];i++)S.deleteDoc(fdoc(m[1]+"_"+i)).catch(e=>console.warn("não apagou",e.code))};
 window.fetchBlob=async a=>{const m=/^fs:([^:]+):(\d+)$/.exec(a.path||"");if(!m)return null;
  const parts=await Promise.all([...Array(+m[2])].map((_,i)=>S.getDoc(fdoc(m[1]+"_"+i)).then(d=>{if(!d.exists())throw new Error("parte do arquivo faltando");return d.data().d.toUint8Array()})));
  return new Blob(parts,{type:a.tipo||""})};
 window.lerDoc=async files=>{
  const AI=await import(V+"firebase-ai.js"),ai=AI.getAI(auth.app,{backend:window.AI_BACKEND=="google"?new AI.GoogleAIBackend():new AI.VertexAIBackend("global")});
  const props={};for(const [k,d] of Object.entries(DOCF))props[k]=AI.Schema.string({description:d});
  const schema=AI.Schema.object({properties:props,optionalProperties:Object.keys(props)});
  const parts=await Promise.all(files.map(toPart));let last;
  for(const m of window.AI_MODELS){try{
   const model=AI.getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:"application/json",responseSchema:schema,temperature:0}});
   const r=await model.generateContent([DOC_PROMPT,...parts]);return JSON.parse(r.response.text())
  }catch(e){last=e;console.warn("modelo",m,e);if(!/not.?found|404|is not supported|unsupported model|invalid model/i.test(e.message||""))throw e}}
  throw last};
 A.onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];window.onAuth(u);
  if(u)[["imoveis","houses"],["clientes","clients"]].forEach(([c,k])=>un.push(S.onSnapshot(S.collection(db,"users",u.uid,c),s=>window.onData(k,s.docs.map(d=>d.data())),e=>window.onFail(e))))},e=>window.onFail(e));
}catch(e){console.error(e);window.onFail(e)}
</script>
