<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Monograma DS da Darling Soares: o D laranja com o miolo em forma de casa e o S grafite por cima.
       Fundo inteiro (o celular arredonda o ícone); o desenho fica na área segura central. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/>
      <stop offset="1" stop-color="#efe5d7"/>
    </linearGradient>
    <linearGradient id="laranja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6923f"/>
      <stop offset="1" stop-color="#df5418"/>
    </linearGradient>
    <linearGradient id="grafite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c6863"/>
      <stop offset="1" stop-color="#3b3835"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)"/>
  <!-- D com a casa vazada no meio -->
  <path fill="url(#laranja)" fill-rule="evenodd"
        d="M92 128 H190 A128 128 0 0 1 190 384 H92 Z
           M146 264 L196 220 L246 264 V328 H146 Z"/>
  <!-- S: contorno claro por baixo (separa do D) e o traço grafite por cima -->
  <g transform="translate(362 262) scale(.84) translate(-341 -262)">
  <path d="M404 196 C 388 160, 300 154, 292 208 C 284 262, 404 256, 404 316 C 404 378, 308 386, 278 338"
        fill="none" stroke="#fbf6ef" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M404 196 C 388 160, 300 154, 292 208 C 284 262, 404 256, 404 316 C 404 378, 308 386, 278 338"
        fill="none" stroke="url(#grafite)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
